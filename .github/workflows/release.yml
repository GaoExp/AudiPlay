name: Build & Release APK

on:
push:
tags:
- 'v*'

jobs:
build:
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  - name: Setup Android SDK
    run: |
      SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      echo "sdk.dir=$SDK_DIR" > local.properties

  - name: Install SDK components
    run: |
      SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

  - name: Decode Keystore
    run: |
      echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > app/release.jks

  - name: Build Release APK
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      ./gradlew assembleRelease --no-daemon

  - name: Debug APK Files
    run: |
      find . -type f -name "*.apk"

  - name: Extract Release Notes
    id: changelog
    run: |
      VERSION="${GITHUB_REF_NAME#v}"

      NOTES=$(awk -v ver="$VERSION" '
        /^## / {
          if ($0 ~ "\\[" ver "\") {
            found=1
            next
          } else if (found) {
            exit
          }
        }
        found
      ' CHANGELOG.md)

      echo "notes<<EOF" >> $GITHUB_OUTPUT
      echo "$NOTES" >> $GITHUB_OUTPUT
      echo "EOF" >> $GITHUB_OUTPUT

  - name: Upload APK to GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      files: |
        **/build/outputs/apk/release/*.apk
      body: ${{ steps.changelog.outputs.notes }}