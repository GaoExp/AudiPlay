# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# JVM / Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Stabilitas build AndroidIDE
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configureondemand=false

# Suppress Java deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Override server-level aapt2 override to suppress experimental warning
android.aapt2FromMavenOverride=

# Hide noisy Gradle task logs #debug, info, lifecycle, warn, quiet
org.gradle.logging.level=lifecycle

# Cleaner terminal output #plain, auto
org.gradle.console=auto